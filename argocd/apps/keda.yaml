# KEDA core — event-driven autoscaler. Required by the http-add-on that scales per-tenant
# Nightscout pods to zero (example-app scale-out). Installed from the upstream Helm chart.
# sync-wave 0: comes up before keda-http (wave 1). prune OFF — never auto-delete the operator.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keda
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://kedacore.github.io/charts
    chart: keda
    targetRevision: 2.15.1
    helm:
      releaseName: keda
  destination:
    server: https://kubernetes.default.svc
    namespace: keda
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true      # KEDA CRDs are large — avoid the last-applied annotation limit
