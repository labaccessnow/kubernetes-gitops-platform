# sealed-secrets controller — vendored, pinned (argocd/sealed-secrets/controller.yaml).
# Lets encrypted SealedSecret CRs live in git; the controller decrypts them into real
# Secrets in-cluster. The controller's private key is secret-zero (backed up to SOPS
# sealed_secrets_key for DR). ServerSideApply avoids client-side last-applied size limits on the CRD.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:example-org/platform.git
    targetRevision: main
    path: argocd/sealed-secrets
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
