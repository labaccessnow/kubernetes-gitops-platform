# App-of-apps root. ArgoCD watches argocd/apps/ in this repo; every Application
# manifest there becomes a managed app. Onboarding app #2 = drop a file in argocd/apps/.
# selfHeal reverts drift; prune is OFF so removing a file never deletes running workloads
# (delete an app deliberately with `kubectl delete application <name> -n argocd`).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:example-org/platform.git
    targetRevision: main
    path: argocd/apps
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
    syncOptions:
      - CreateNamespace=false
